<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Recetario</title>
</head>
<body>

    <header class="header">
        <nav class="header_nav">
            <div class="header_nav_containerLogo">

    <main class="main">
        <h2 class="form_title">¿Idea de receta nueva?</h2>
        <form class="form_container" action="#">
            <label for="nombre">Nombre</label>
            <input name="nombre" id="nombre" type="text">

            <label for="origen">País de origen</label>
            <input  type="text">

            <label for="">Ingredientes</label>
            <textarea name="" id=""></textarea>

            <label for="">¿Tiempo de preparación estimado?</label>
            <input type="number">

            <label for="">Categoría</label>
            <input type="text" name="" id="">

            <Label for="">Instrucciones de preparación</Label>
            <textarea name="" id=""></textarea>

            <button type="submit">Guardar receta</button>
        </form>

        <section>

        </section>
    </main>
    
</body>
