<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/styles.css">
    <title>Recetario</title>
</head>
<body>

    <header class="header">
        <nav class="header_nav">
            <img class="logo" src="./assets/img/restaurante.png" alt="logo">
            <button class="header_btn"><img src="./assets/img/menu.png" alt=""></button>
            <ul class="header_nav_list">
                <li><a>Todas</a></li>
                <li><a>Chile</a></li>
                <li><a>Perú</a></li>
                <li><a>Argentina</a></li>
                <li><a>Italia</a></li>
                <li><a>España</a></li>
            </ul>
        </nav>
              
        <h1 class="header_title"><span>Mis</span><br>Recetas</h1>
            
        <div class="header_searcher">
            <img class="header_searcher_icon" src="./assets/img/buscar.png" alt="busqueda-icon">
            <input type="text" id="id_buscarReceta" placeholder="Buscar receta">
        </div>
    </header>

    <main class="main">
        <div class="form_container_bg">
            <h2 class="form_title">¿Idea de receta nueva?</h2>
            <form class="form_container" action="#">
                <label for="id_titulo">Titulo</label>
                <input name="titulo" id="id_titulo" type="text">
    
                <label for="id_origen">País de origen</label>
                <input name="origen" id="id_origen"  type="text">
    
                <label for="id_ingredientes">Ingredientes</label>
                <div class="ingredientes_container_input">
                    <input type="text" id="id_ingredientes" name="ingredientes">
                    <button type="button" class="btn_ingrediente">Añadir +</button>
                </div>
                <div class="ingredientes_container_list">
                    <ul class="list_ingr">

                    </ul>
                </div>
    
                <label for="id_tiempo">¿Tiempo de preparación estimado?</label>
                <input name="tiempo" id="id_tiempo" type="time">
    
                <label for="id_categoria">Categoría</label>
                <input type="text" name="categoria" id="id_categoria">
    
                <label for="id_preparacion">Instrucciones de preparación</label>
                <textarea name="preparacion" id="id_preparacion"></textarea>
    
                <button class="btn_form" type="submit">Guardar receta</button>
            </form>
        </div>
        <div>
            <h4 class="msj_sinReceta">Aún no has añadido ninguna receta 🍽️</h4>
    
            <section class="card_container"></section>

        </div>


        
    </main>
    <footer class="footer">
        <p>Hecho con ❤️ y JavaScript</p>
        <p>
            <a href="https://github.com/PauletteM06" target="_blank">GitHub</a> |
            <a href="https://www.linkedin.com/in/scarlett-m%C3%A1rquez-torres-7996b4292/" target="_blank">LinkedIn</a> |
        </p>
    </footer>
    
    <script src="./js/main.js"></script>
</body>
</html>
